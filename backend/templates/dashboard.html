<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 记账助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --text2: #64748b;
  --border: #e2e8f0; --accent: #3b82f6; --danger: #ef4444; --hover: #f8fafc;
}
.dark {
  --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text2: #94a3b8;
  --border: #334155; --accent: #60a5fa; --danger: #f87171; --hover: #1e293b;
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.btn { padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all .2s; border: none; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { opacity: .9; }
.btn-ghost { background: transparent; color: var(--text2); }
.btn-ghost:hover { background: var(--hover); }
.btn-danger { background: transparent; color: var(--danger); }
.btn-danger:hover { background: #fef2f2; }
.input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font-size: 14px; outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
select.input { appearance: none; cursor: pointer; }
.tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 40; padding: 4px 0 env(safe-area-inset-bottom, 8px); }
.tab-item { flex: 1; text-align: center; padding: 6px 0; font-size: 11px; color: var(--text2); cursor: pointer; transition: .2s; }
.tab-item.active { color: var(--accent); font-weight: 600; }
.tab-item .tab-icon { font-size: 20px; display: block; margin-bottom: 2px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: center; justify-content: center; }
.modal-content { background: var(--card); border-radius: 16px; padding: 24px; width: 90%; max-width: 420px; max-height: 80vh; overflow-y: auto; }
.modal-content select { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 14px; }
.heat-cell { border-radius: 4px; transition: .2s; cursor: default; }
.heat-cell:hover { transform: scale(1.2); }
.skeleton { animation: pulse 1.5s infinite; background: linear-gradient(90deg, var(--border) 25%, transparent 50%, var(--border) 75%); background-size: 200% 100%; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
</style>
</head>
<body class="min-h-screen pb-20">

<!-- ==================== 登录页 ==================== -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center hidden">
  <div class="card w-full max-w-sm text-center">
    <div class="text-4xl mb-4">🤖</div>
    <h2 class="text-xl font-bold mb-1" data-i18n="loginTitle">AI 记账助手</h2>
    <p class="text-sm text-[var(--text2)] mb-4">登录以查看你的账单</p>
    <input id="loginUser" class="input mb-2" placeholder="用户名">
    <input id="loginPwd" type="password" class="input mb-3" placeholder="密码">
    <button class="btn btn-accent w-full" onclick="doLogin()">登录</button>
    <p id="loginMsg" class="text-xs text-red-500 mt-2 hidden"></p>
  </div>
</div>

<!-- ==================== 主应用 ==================== -->
<div id="appScreen" class="max-w-2xl mx-auto px-4 pt-4">

  <!-- 顶部栏 -->
  <div id="topFilters" class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2">
      <select id="selYear" class="input text-sm w-20" onchange="loadCurrentTab()"></select>
      <select id="selMonth" class="input text-sm w-16" onchange="loadCurrentTab()"><option value="all" data-i18n="allMonths">全部</option></select>
    </div>
  </div>

  <!-- Tab 内容区 -->
  <div id="tabContent" class="space-y-3"></div>
</div>

<!-- ==================== 底部导航 ==================== -->
<nav class="tab-bar">
  <div class="tab-item active" data-tab="feed">
    <span class="tab-icon">📋</span><span data-i18n="tabFeed">流水</span>
  </div>
  <div class="tab-item" data-tab="details">
    <span class="tab-icon">📝</span><span data-i18n="tabDetails">明细</span>
  </div>
  <div class="tab-item" data-tab="stats">
    <span class="tab-icon">📊</span><span data-i18n="tabStats">统计</span>
  </div>
  <div class="tab-item" data-tab="settings">
    <span class="tab-icon">⚙️</span><span data-i18n="tabSettings">设置</span>
  </div>
</nav>

<!-- ==================== 编辑弹窗 ==================== -->
<div id="editModal" class="modal hidden">
  <div class="modal-content">
    <h3 class="font-bold text-lg mb-4" data-i18n="editTitle">编辑账单</h3>
    <input type="hidden" id="editId">
    <label class="block text-xs text-[var(--text2)] mb-1" data-i18n="fieldName">名称</label>
    <input id="editName" class="input mb-3">
    <label class="block text-xs text-[var(--text2)] mb-1" data-i18n="fieldAmount">金额</label>
    <input id="editAmount" type="number" step="0.01" class="input mb-3">
    <label class="block text-xs text-[var(--text2)] mb-1" data-i18n="fieldCategory">分类</label>
    <select id="editCategory" class="input mb-3"></select>
    <label class="block text-xs text-[var(--text2)] mb-1" data-i18n="fieldDate">时间</label>
    <input id="editDate" type="datetime-local" class="input mb-4">
    <div class="flex gap-2 justify-end">
      <button class="btn btn-ghost" onclick="closeEdit()" data-i18n="cancel">取消</button>
      <button class="btn btn-accent" onclick="saveEdit()" data-i18n="save">保存</button>
    </div>
  </div>
</div>

<!-- ==================== 分类弹窗 ==================== -->
<div id="catModal" class="modal hidden">
  <div class="modal-content">
    <h3 class="font-bold text-lg mb-4" data-i18n="catTitle">分类管理</h3>
    <div id="catList" class="space-y-2 mb-4 max-h-60 overflow-y-auto"></div>
    <div class="flex gap-2 mb-3">
      <input id="newCatName" class="input flex-1" placeholder="分类名">
      <input id="newCatIcon" class="input w-16" placeholder="图标" value="📌">
      <input id="newCatColor" type="color" class="w-10 h-10 rounded cursor-pointer" value="#3b82f6">
    </div>
    <button class="btn btn-accent w-full text-sm" onclick="addCategory()">+ 添加分类</button>
    <button class="btn btn-ghost w-full mt-2 text-sm" onclick="document.getElementById('catModal').classList.add('hidden')" data-i18n="close">关闭</button>
  </div>
</div>

<script>
// ==================== 全局状态 ====================
const STORE = {
  theme: localStorage.getItem('acc_theme') || 'light',
  lang: localStorage.getItem('acc_lang') || 'zh_CN',
  user: JSON.parse(localStorage.getItem('acc_user') || 'null'),
  currentTab: 'feed',
  currentPage: 1,
  currentSort: 'date_desc',
  statsView: 'monthly',
  statsYear: new Date().getFullYear(),
  statsMonth: new Date().getMonth() + 1,
};

// ==================== i18n ====================
const T = {
  loginTitle: { zh_CN: 'AI 记账助手', zh_TW: 'AI 記帳助手', en: 'AI Bookkeeper' },
  loginSub: { zh_CN: '输入密码解锁仪表盘', zh_TW: '輸入密碼解鎖儀表盤', en: 'Enter password to unlock' },
  loginBtn: { zh_CN: '解锁', zh_TW: '解鎖', en: 'Unlock' },
  loginFail: { zh_CN: '密码错误', zh_TW: '密碼錯誤', en: 'Wrong password' },
  monthlyTotal: { zh_CN: '本月支出', zh_TW: '本月支出', en: 'Monthly Spend' },
  allMonths: { zh_CN: '全部', zh_TW: '全部', en: 'All' },
  tabFeed: { zh_CN: '流水', zh_TW: '流水', en: 'Feed' },
  tabDetails: { zh_CN: '明细', zh_TW: '明細', en: 'Details' },
  tabStats: { zh_CN: '统计', zh_TW: '統計', en: 'Stats' },
  tabSettings: { zh_CN: '设置', zh_TW: '設置', en: 'Settings' },
  editTitle: { zh_CN: '编辑账单', zh_TW: '編輯賬單', en: 'Edit Entry' },
  fieldName: { zh_CN: '名称', zh_TW: '名稱', en: 'Name' },
  fieldAmount: { zh_CN: '金额', zh_TW: '金額', en: 'Amount' },
  fieldCategory: { zh_CN: '分类', zh_TW: '分類', en: 'Category' },
  fieldDate: { zh_CN: '时间', zh_TW: '時間', en: 'Time' },
  cancel: { zh_CN: '取消', zh_TW: '取消', en: 'Cancel' },
  save: { zh_CN: '保存', zh_TW: '儲存', en: 'Save' },
  delete: { zh_CN: '删除', zh_TW: '刪除', en: 'Delete' },
  edit: { zh_CN: '编辑', zh_TW: '編輯', en: 'Edit' },
  noData: { zh_CN: '暂无记录', zh_TW: '暫無記錄', en: 'No records' },
  exportCSV: { zh_CN: '导出 CSV', zh_TW: '匯出 CSV', en: 'Export CSV' },
  search: { zh_CN: '搜索...', zh_TW: '搜尋...', en: 'Search...' },
  catTitle: { zh_CN: '分类管理', zh_TW: '分類管理', en: 'Categories' },
  close: { zh_CN: '关闭', zh_TW: '關閉', en: 'Close' },
  settingsTheme: { zh_CN: '主题', zh_TW: '主題', en: 'Theme' },
  themeLight: { zh_CN: '浅色', zh_TW: '淺色', en: 'Light' },
  themeDark: { zh_CN: '深色', zh_TW: '深色', en: 'Dark' },
  themeSystem: { zh_CN: '跟随系统', zh_TW: '跟随系統', en: 'System' },
  settingsLang: { zh_CN: '语言', zh_TW: '語言', en: 'Language' },
  langCN: { zh_CN: '简体中文', zh_TW: '簡體中文', en: 'Simplified Chinese' },
  langTW: { zh_CN: '繁體中文', zh_TW: '繁體中文', en: 'Traditional Chinese' },
  langEN: { zh_CN: 'English', zh_TW: 'English', en: 'English' },
  settingsAccount: { zh_CN: '账户', zh_TW: '賬戶', en: 'Account' },
  changePwd: { zh_CN: '修改密码', zh_TW: '修改密碼', en: 'Change Password' },
  logout: { zh_CN: '退出登录', zh_TW: '退出登錄', en: 'Logout' },
  settingsCats: { zh_CN: '分类管理', zh_TW: '分類管理', en: 'Manage Categories' },
  settingsAbout: { zh_CN: '关于', zh_TW: '關於', en: 'About' },
  week: { zh_CN: '本周', zh_TW: '本週', en: 'Week' },
  month: { zh_CN: '本月', zh_TW: '本月', en: 'Month' },
  year: { zh_CN: '本年', zh_TW: '本年', en: 'Year' },
  totalSpend: { zh_CN: '总支出', zh_TW: '總支出', en: 'Total' },
  avgDaily: { zh_CN: '日均', zh_TW: '日均', en: 'Daily Avg' },
  txCount: { zh_CN: '笔数', zh_TW: '筆數', en: 'Count' },
  rankCat: { zh_CN: '分类排行', zh_TW: '分類排行', en: 'By Category' },
  rankItem: { zh_CN: '商家排行', zh_TW: '商家排行', en: 'By Merchant' },
};
function t(key) { return (T[key]||{})[STORE.lang] || key; }
function applyI18n() { document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if (el.tagName==='INPUT' && el.placeholder !== undefined) el.placeholder=t(k); else if (el.tagName==='OPTION') el.textContent=t(k); else el.textContent = t(k); }); }

// ==================== 主题 ====================
function applyTheme() {
  const h = document.documentElement;
  if (STORE.theme === 'dark') h.classList.add('dark');
  else if (STORE.theme === 'light') h.classList.remove('dark');
  else h.classList.toggle('dark', window.matchMedia('(prefers-color-scheme:dark)').matches);
}

// ==================== 认证 ====================
function checkAuth() {
  if (STORE.user && STORE.user.api_key) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    return true;
  }
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('hidden');
  return false;
}
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPwd').value;
  if (!username || !password) {
    document.getElementById('loginMsg').classList.remove('hidden');
    document.getElementById('loginMsg').textContent = '请输入用户名和密码';
    return;
  }
  const r = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  });
  const d = await r.json();
  if (d.success) {
    STORE.user = d.data;
    localStorage.setItem('acc_user', JSON.stringify(d.data));
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    init();
  } else {
    document.getElementById('loginMsg').classList.remove('hidden');
    document.getElementById('loginMsg').textContent = d.error || '登录失败';
  }
}
function doLogout() { STORE.user = null; localStorage.removeItem('acc_user'); location.reload(); }

// ==================== API ====================
function apiHeaders() {
  const key = (STORE.user && STORE.user.api_key) || '';
  return { 'X-API-Key': key, 'Content-Type': 'application/json' };
}
async function api(url, opts={}) {
  opts.headers = { ...apiHeaders(), ...(opts.headers||{}) };
  const r = await fetch(url, opts);
  if (r.status === 403) { alert('登录已失效，请重新登录'); doLogout(); }
  return r;
}

// ==================== Tab 路由 ====================
function switchTab(tab) {
  STORE.currentTab = tab; STORE.currentPage = 1;
  document.querySelectorAll('.tab-item').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  const showFilters = tab === 'feed' || tab === 'details';
  document.getElementById('topFilters').style.display = showFilters ? '' : 'none';
  loadCurrentTab();
}
function loadCurrentTab() {
  const t = STORE.currentTab;
  if (t === 'feed') loadFeed();
  else if (t === 'details') loadDetails();
  else if (t === 'stats') loadStats();
  else if (t === 'settings') loadSettings();
}

// ==================== 流水 ====================
async function loadFeed() {
  const ym = getYearMonth();
  const params = new URLSearchParams({ page: STORE.currentPage, page_size: 20, sort: STORE.currentSort });
  if (ym.month) { params.set('date_from', ym.start); params.set('date_to', ym.end); }
  const catFilter = document.getElementById('feedCatFilter')?.value;
  if (catFilter) params.set('category', catFilter);
  const r = await api('/api/transactions?' + params);
  const d = (await r.json()).data;

  const sortArrow = (field) => {
    if (field==='date') return STORE.currentSort==='date_asc'?'▲':STORE.currentSort==='date_desc'?'▼':'';
    return STORE.currentSort==='amount_asc'?'▲':STORE.currentSort==='amount_desc'?'▼':'';
  };
  const sortActive = (field) => STORE.currentSort?.startsWith(field);

  let html = `
    <div class="flex gap-2 mb-3 flex-wrap items-center">
      <button class="btn btn-ghost text-xs ${sortActive('date')?'font-bold text-[var(--accent)]':''}" onclick="toggleSort('date')">时间 ${sortArrow('date')}</button>
      <button class="btn btn-ghost text-xs ${sortActive('amount')?'font-bold text-[var(--accent)]':''}" onclick="toggleSort('amount')">金额 ${sortArrow('amount')}</button>
      <select id="feedCatFilter" class="input text-xs w-24" onchange="loadFeed()"><option value="">全部分类</option></select>
      <div class="flex-1"></div>
      <div class="text-sm"><span class="text-[var(--text2)]">总计</span> <span id="feedTotal" class="font-bold">¥ --</span></div>
    </div>`;

  if (!d.items.length) html += `<div class="card text-center text-[var(--text2)] py-10">${t('noData')}</div>`;
  else d.items.forEach(tx => {
    const catColor = tx.color || '#ccc';
    html += `<div class="card flex items-center gap-3 hover:bg-[var(--hover)] transition">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg" style="background:${catColor}20">${tx.icon||'📌'}</div>
      <div class="flex-1 min-w-0">
        <div class="font-medium truncate">${escHtml(tx.item_name)}</div>
        <div class="text-xs text-[var(--text2)]">${tx.trans_date} · ${tx.category||'其他'}</div>
      </div>
      <div class="text-right">
        <div class="font-mono font-bold">${tx.currency} ${Number(tx.amount).toFixed(2)}</div>
        <div class="flex gap-1 justify-end mt-1">
          <button class="btn btn-ghost text-xs py-1 px-2" onclick="openEdit(${tx.id},'${escAttr(tx.item_name)}',${tx.amount},'${tx.category}','${tx.trans_date}')">✏️</button>
          <button class="btn btn-danger text-xs py-1 px-2" onclick="delTx(${tx.id})">🗑️</button>
        </div>
      </div>
    </div>`;
  });

  html += pageNav(d);
  document.getElementById('tabContent').innerHTML = html;
  populateCatFilter('feedCatFilter', catFilter);
  updateFeedTotal(ym, catFilter);
}

// ==================== 明细 ====================
async function loadDetails() {
  const ym = getYearMonth();
  const searchEl = document.getElementById('detailSearch');
  const search = searchEl ? searchEl.value : '';
  const params = new URLSearchParams({ page: STORE.currentPage, page_size: 20 });
  if (ym.month) { params.set('date_from', ym.start); params.set('date_to', ym.end); }
  if (search) params.set('search', search);
  const r = await api('/api/transactions?' + params);
  const d = (await r.json()).data;

  let html = `
    <div class="flex gap-2 mb-3">
      <input id="detailSearch" class="input flex-1" placeholder="${t('search')}" value="${search}" onkeydown="if(event.key==='Enter')loadDetails()">
      <button class="btn btn-accent text-sm" onclick="loadDetails()">🔍</button>
      <button class="btn btn-accent text-sm" onclick="openCreate()">➕ 添加</button>
      <button class="btn btn-ghost text-sm" onclick="exportCSV()">📥 ${t('exportCSV')}</button>
    </div>
    <div class="card overflow-x-auto p-2"><table class="w-full text-sm"><thead><tr class="text-[var(--text2)] text-left border-b border-[var(--border)]">
      <th class="pb-2 pr-2 whitespace-nowrap">${t('fieldDate')}</th><th class="pb-2 pr-2">${t('fieldCategory')}</th><th class="pb-2 pr-2">${t('fieldName')}</th><th class="pb-2 pr-2 text-right">${t('fieldAmount')}</th><th class="pb-2 pr-2 text-right w-16">操作</th>
    </tr></thead><tbody>`;

  if (!d.items.length) html += `<tr><td colspan="5" class="py-8 text-center text-[var(--text2)]">${t('noData')}</td></tr>`;
  else d.items.forEach(tx => {
    html += `<tr class="border-b border-[var(--border)] hover:bg-[var(--hover)]">
      <td class="py-2 pr-2 text-xs text-[var(--text2)] whitespace-nowrap">${tx.trans_date}</td>
      <td class="py-2 pr-2 text-xs">${tx.category||'-'}</td>
      <td class="py-2 pr-2 font-medium text-sm">${escHtml(tx.item_name)}</td>
      <td class="py-2 pr-2 text-right font-mono text-sm">${tx.currency} ${Number(tx.amount).toFixed(2)}</td>
      <td class="py-2 pr-2 text-right">
        <button class="btn btn-ghost text-xs py-1 px-1" onclick="openEdit(${tx.id},'${escAttr(tx.item_name)}',${tx.amount},'${tx.category}','${tx.trans_date}')">✏️</button>
        <button class="btn btn-danger text-xs py-1 px-1" onclick="delTx(${tx.id})">🗑️</button>
      </td></tr>`;
  });

  html += `</tbody></table></div>` + pageNav(d);
  document.getElementById('tabContent').innerHTML = html;
}

// ==================== 统计 ====================
let statsBarChart = null;
function statsMonthStr() { return STORE.statsYear+'-'+String(STORE.statsMonth).padStart(2,'0'); }
async function loadStats() {
  const isMonthly = STORE.statsView === 'monthly';
  const thisY = new Date().getFullYear();
  const years = Array.from({length:5},(_,i)=>thisY-2+i);
  const yOpts = years.map(y=>`<option value="${y}" ${y===STORE.statsYear?'selected':''}>${y}年</option>`).join('');
  const mOpts = Array.from({length:12},(_,i)=>`<option value="${i+1}" ${(i+1)===STORE.statsMonth?'selected':''}>${i+1}月</option>`).join('');

  let html = `
    <div class="flex gap-2 mb-3">
      <button class="btn btn-ghost text-sm ${isMonthly?'font-bold text-[var(--accent)]':''}" onclick="STORE.statsView='monthly';loadStats()">📅 月账单</button>
      <button class="btn btn-ghost text-sm ${!isMonthly?'font-bold text-[var(--accent)]':''}" onclick="STORE.statsView='yearly';loadStats()">📆 年账单</button>
    </div>`;

  if (isMonthly) {
    html += `
    <div class="flex gap-2 mb-3">
      <select class="input text-sm w-20" onchange="STORE.statsYear=+this.value;loadStats()">${yOpts}</select>
      <select class="input text-sm w-16" onchange="STORE.statsMonth=+this.value;loadStats()">${mOpts}</select>
    </div>`;

    const monthStr = statsMonthStr();
    const [catR, monthlyR, rankR] = await Promise.all([
      api('/api/stats/category?month='+monthStr),
      api('/api/stats/monthly?year='+STORE.statsYear),
      api('/api/stats/ranking?month='+monthStr+'&limit=5'),
    ]);
    const catData = (await catR.json()).data;
    const monthlyData = (await monthlyR.json()).data;
    const rankData = (await rankR.json()).data;
    const totalAll = catData.reduce((s,d)=>s+d.total, 0);

    html += `<div class="card text-center mb-4">
      <div class="text-xs text-[var(--text2)]">${STORE.statsYear}年${STORE.statsMonth}月 · 合计</div>
      <div class="text-2xl font-bold">¥ ${totalAll.toFixed(0)}</div>
    </div>`;

    // 每月支出对比 — 可左右滚动的柱状图
    html += `<div class="card mb-4"><h4 class="text-xs text-[var(--text2)] mb-2">📊 ${STORE.statsYear}年 每月支出对比</h4>
      <div style="overflow-x:auto;padding-bottom:8px"><div style="min-width:800px"><canvas id="statsBarChart" height="200"></canvas></div></div></div>`;

    // 当月支出构成
    html += `<div class="card mb-4"><h4 class="text-xs text-[var(--text2)] mb-2">📂 当月支出构成</h4>`;
    if (!catData.length) html += `<p class="text-xs text-[var(--text2)] py-2">${t('noData')}</p>`;
    else catData.forEach(c => {
      const pct = totalAll ? (c.total/totalAll*100).toFixed(1) : 0;
      html += `<div class="flex items-center gap-2 text-sm py-1">
        <span>${c.icon||'📌'}</span><span class="w-14">${c.category}</span>
        <div class="flex-1 h-3 bg-[var(--hover)] rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:${c.color||'#3b82f6'}"></div></div>
        <span class="font-mono text-xs w-16 text-right">¥${c.total.toFixed(0)}</span><span class="text-xs text-[var(--text2)] w-10 text-right">${pct}%</span></div>`;
    });
    html += `</div>`;

    // 当月支出排行
    html += `<div class="card"><h4 class="text-xs text-[var(--text2)] mb-2">🏆 当月支出排行</h4>`;
    if (!rankData.by_item.length) html += `<p class="text-xs text-[var(--text2)] py-2">${t('noData')}</p>`;
    else {
      const maxItem = rankData.by_item[0]?.total || 1;
      rankData.by_item.forEach((r,i) => {
        const pct = maxItem ? (r.total/maxItem*100).toFixed(0) : 0;
        html += `<div class="flex items-center gap-2 text-sm py-1">
          <span class="w-6 text-center font-bold text-[var(--text2)]">${i+1}</span>
          <span class="flex-1 truncate">${escHtml(r.item_name)}</span>
          <div class="w-24 h-2 bg-[var(--hover)] rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:var(--accent)"></div></div>
          <span class="font-mono text-xs w-16 text-right">¥${r.total.toFixed(0)}</span></div>`;
      });
    }
    html += `</div>`;

    document.getElementById('tabContent').innerHTML = html;

    // 柱状图
    setTimeout(()=>{
      const ctx = document.getElementById('statsBarChart'); if (!ctx) return;
      if (statsBarChart) statsBarChart.destroy();
      // 补全12个月（无数据月份填0）
      const dataMap = {}; monthlyData.forEach(d=>{ dataMap[d.month] = d.total; });
      const labels = []; const totals = []; const bgColors = [];
      for (let m=1; m<=12; m++) {
        const key = STORE.statsYear+'-'+String(m).padStart(2,'0');
        labels.push(m+'月');
        totals.push(dataMap[key]||0);
        bgColors.push(m===STORE.statsMonth?'rgba(59,130,246,.9)':'rgba(148,163,184,.4)');
      }
      statsBarChart = new Chart(ctx, { type:'bar', data:{labels,datasets:[{data:totals,backgroundColor:bgColors,borderRadius:4,barPercentage:0.6,categoryPercentage:0.8}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'var(--border)'}},x:{grid:{display:false}}}} });
    }, 100);

  } else {
    // 年账单
    html += `
    <div class="flex gap-2 mb-3">
      <select class="input text-sm w-20" onchange="STORE.statsYear=+this.value;loadStats()">${yOpts}</select>
    </div>`;

    const [catR, rankR] = await Promise.all([
      api('/api/stats/category?year='+STORE.statsYear),
      api('/api/stats/ranking?year='+STORE.statsYear+'&limit=5'),
    ]);
    const catData = (await catR.json()).data;
    const rankData = (await rankR.json()).data;
    const totalAll = catData.reduce((s,d)=>s+d.total, 0);

    html += `<div class="card text-center mb-4">
      <div class="text-xs text-[var(--text2)]">${STORE.statsYear}年 · 合计</div>
      <div class="text-2xl font-bold">¥ ${totalAll.toFixed(0)}</div>
    </div>`;

    // 支出构成
    html += `<div class="card mb-4"><h4 class="text-xs text-[var(--text2)] mb-2">📂 支出构成</h4>`;
    if (!catData.length) html += `<p class="text-xs text-[var(--text2)] py-2">${t('noData')}</p>`;
    else catData.forEach(c => {
      const pct = totalAll ? (c.total/totalAll*100).toFixed(1) : 0;
      html += `<div class="flex items-center gap-2 text-sm py-1">
        <span>${c.icon||'📌'}</span><span class="w-14">${c.category}</span>
        <div class="flex-1 h-3 bg-[var(--hover)] rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:${c.color||'#3b82f6'}"></div></div>
        <span class="font-mono text-xs w-16 text-right">¥${c.total.toFixed(0)}</span><span class="text-xs text-[var(--text2)] w-10 text-right">${pct}%</span></div>`;
    });
    html += `</div>`;

    // 排行
    html += `<div class="card"><h4 class="text-xs text-[var(--text2)] mb-2">🏆 ${STORE.statsYear}年 支出排行</h4>`;
    if (!rankData.by_item.length) html += `<p class="text-xs text-[var(--text2)] py-2">${t('noData')}</p>`;
    else {
      const maxItem = rankData.by_item[0]?.total || 1;
      rankData.by_item.forEach((r,i) => {
        const pct = maxItem ? (r.total/maxItem*100).toFixed(0) : 0;
        html += `<div class="flex items-center gap-2 text-sm py-1">
          <span class="w-6 text-center font-bold text-[var(--text2)]">${i+1}</span>
          <span class="flex-1 truncate">${escHtml(r.item_name)}</span>
          <div class="w-24 h-2 bg-[var(--hover)] rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:var(--accent)"></div></div>
          <span class="font-mono text-xs w-16 text-right">¥${r.total.toFixed(0)}</span></div>`;
      });
    }
    html += `</div>`;

    document.getElementById('tabContent').innerHTML = html;
  }
}

// ==================== 设置 ====================
async function loadSettings() {
  const user = STORE.user || {};
  let html = `
    <div class="card mb-3"><h4 class="font-medium mb-2">👤 账户信息</h4>
      <div class="text-sm space-y-1">
        <p>用户名：<strong>${escHtml(user.username||'')}</strong> ${user.is_admin?'<span class="tag" style="background:var(--accent);color:#fff">管理员</span>':''}</p>
        <p>API Key：<code class="text-xs bg-[var(--hover)] px-2 py-1 rounded select-all">${escHtml(user.api_key||'')}</code> <button class="btn btn-ghost text-xs py-0 px-1" onclick="copyApiKey()">📋</button></p>
        <p class="text-xs text-[var(--text2)]">将此 Key 填入 iPhone 快捷指令的 X-API-Key 头</p>
      </div></div>

    <div class="card mb-3"><h4 class="font-medium mb-2">🎨 ${t('settingsTheme')}</h4>
      <div class="flex gap-3">${['light','dark','system'].map(th => `<label class="flex items-center gap-1 text-sm cursor-pointer"><input type="radio" name="theme" value="${th}" ${STORE.theme===th?'checked':''} onchange="setTheme('${th}')"> ${t('theme'+th.charAt(0).toUpperCase()+th.slice(1))}</label>`).join('')}</div></div>
    <div class="card mb-3"><h4 class="font-medium mb-2">🌐 ${t('settingsLang')}</h4>
      <div class="flex gap-3">${['zh_CN','zh_TW','en'].map(l => `<label class="flex items-center gap-1 text-sm cursor-pointer"><input type="radio" name="lang" value="${l}" ${STORE.lang===l?'checked':''} onchange="setLang('${l}')"> ${t('lang'+({zh_CN:'CN',zh_TW:'TW',en:'EN'}[l]))}</label>`).join('')}</div></div>
    <div class="card mb-3"><h4 class="font-medium mb-2">📂 ${t('settingsCats')}</h4>
      <button class="btn btn-accent text-sm" onclick="openCatManager()">${t('settingsCats')}</button></div>`;

  // 管理员：用户管理
  if (user.is_admin) {
    html += `<div class="card mb-3"><h4 class="font-medium mb-2">👥 用户管理</h4>
      <div id="userList" class="text-sm space-y-1 mb-3"></div>
      <div class="flex gap-2">
        <input id="newUsername" class="input flex-1 text-sm" placeholder="新用户名">
        <input id="newUserPwd" class="input w-24 text-sm" placeholder="密码">
        <button class="btn btn-accent text-sm" onclick="createUser()">+ 添加</button>
      </div></div>`;
  }

  html += `
    <div class="card mb-3"><h4 class="font-medium mb-2">🔐 ${t('settingsAccount')}</h4>
      <div class="flex gap-2"><button class="btn btn-danger text-sm" onclick="doLogout()">${t('logout')}</button></div></div>
    <div class="card"><h4 class="font-medium mb-2">ℹ️ ${t('settingsAbout')}</h4><p class="text-xs text-[var(--text2)]">AI 记账助手 v4.0 · <a href="https://github.com/Koomooneleven/ai-bookkeeping" class="text-[var(--accent)]" target="_blank">GitHub</a></p></div>`;

  document.getElementById('tabContent').innerHTML = html;

  if (user.is_admin) loadUserList();
}

function copyApiKey() {
  navigator.clipboard.writeText(STORE.user.api_key).then(() => alert('API Key 已复制'));
}

async function loadUserList() {
  const r = await api('/api/auth/users');
  const d = await r.json();
  if (!d.success) return;
  document.getElementById('userList').innerHTML = (d.data.users || []).map(u =>
    `<div class="flex items-center gap-2 py-1 border-b border-[var(--border)]">
      <span class="flex-1">${escHtml(u.username)} ${u.is_admin?'👑':''}</span>
      <code class="text-xs bg-[var(--hover)] px-1 rounded">${escHtml(u.api_key)}</code>
      <button class="btn btn-ghost text-xs py-0 px-1" onclick="resetUserKey(${u.id})" title="重置Key">🔄</button>
      <button class="btn btn-ghost text-xs py-0 px-1" onclick="editUser(${u.id},'${escAttr(u.username)}')" title="编辑">✏️</button>
      ${!u.is_admin ? `<button class="btn btn-danger text-xs py-0 px-1" onclick="deleteUser(${u.id},'${escAttr(u.username)}')" title="删除">🗑️</button>` : ''}
    </div>`
  ).join('');
}

async function resetUserKey(userId) {
  if (!confirm('确定重置该用户的 API Key 吗？旧的 Key 将立即失效。')) return;
  const r = await api('/api/auth/users/' + userId + '/reset-key', { method: 'PUT' });
  const d = await r.json();
  if (d.success) {
    alert('新 API Key: ' + d.data.api_key);
    loadUserList();
  } else {
    alert('重置失败: ' + (d.error || '未知错误'));
  }
}
async function editUser(userId, oldName) {
  const name = prompt('新用户名:', oldName);
  if (!name || name === oldName) {
    const pwd = prompt('新密码（留空不修改）:');
    if (!pwd) return;
    if (!confirm('确定修改 ' + oldName + ' 的密码吗？')) return;
    const r = await api('/api/auth/users/' + userId, { method: 'PUT', body: JSON.stringify({ username: oldName, password: pwd }) });
    const d = await r.json();
    alert(d.success ? '密码已更新' : '修改失败: ' + (d.error || ''));
    if (d.success) loadUserList();
    return;
  }
  const pwd = prompt('新密码:');
  if (!pwd) return;
  if (!confirm('确定将 ' + oldName + ' 改为 ' + name + ' 并更新密码吗？')) return;
  const r = await api('/api/auth/users/' + userId, { method: 'PUT', body: JSON.stringify({ username: name, password: pwd }) });
  const d = await r.json();
  alert(d.success ? '用户已更新' : '修改失败: ' + (d.error || ''));
  if (d.success) loadUserList();
}
async function deleteUser(userId, name) {
  if (!confirm('确定删除用户「' + name + '」及其所有数据吗？此操作不可恢复！')) return;
  const r = await api('/api/auth/users/' + userId, { method: 'DELETE' });
  const d = await r.json();
  alert(d.success ? '用户已删除' : '删除失败: ' + (d.error || ''));
  if (d.success) loadUserList();
}
async function createUser() {
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newUserPwd').value;
  if (!username || !password) { alert('请输入用户名和密码'); return; }
  const r = await api('/api/auth/register', {
    method: 'POST',
    body: JSON.stringify({ username, password }),
  });
  const d = await r.json();
  if (d.success) {
    alert('用户已创建！API Key: ' + d.data.api_key);
    loadUserList();
    document.getElementById('newUsername').value = '';
    document.getElementById('newUserPwd').value = '';
  } else {
    alert('创建失败: ' + (d.error || '未知错误'));
  }
}
function setTheme(v) { STORE.theme = v; localStorage.setItem('acc_theme', v); applyTheme(); loadSettings(); }
function setLang(v) { STORE.lang = v; localStorage.setItem('acc_lang', v); applyI18n(); loadCurrentTab(); document.querySelectorAll('.tab-item').forEach(el=>{ const k='tab'+el.dataset.tab.charAt(0).toUpperCase()+el.dataset.tab.slice(1); el.querySelector('span:last-child').textContent=t(k); }); }

// ==================== 编辑功能 ====================
async function openEdit(id, name, amount, cat, date) {
  document.getElementById('editId').value = id;
  document.getElementById('editName').value = name;
  document.getElementById('editAmount').value = amount;
  document.getElementById('editDate').value = (date||'').replace(' ','T');
  const cats = await (await api('/api/categories')).json();
  document.getElementById('editCategory').innerHTML = cats.data.map(c=>`<option value="${c.name}" ${c.name===cat?'selected':''}>${c.icon} ${c.name}</option>`).join('');
  document.querySelector('#editModal h3').textContent = t('editTitle');
  document.getElementById('editModal').classList.remove('hidden');
}
function closeEdit() { document.getElementById('editModal').classList.add('hidden'); }
async function openCreate() {
  document.getElementById('editId').value = '';
  document.getElementById('editName').value = '';
  document.getElementById('editAmount').value = '';
  const now = new Date();
  document.getElementById('editDate').value = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+'T'+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const cats = await (await api('/api/categories')).json();
  document.getElementById('editCategory').innerHTML = cats.data.map(c=>`<option value="${c.name}">${c.icon} ${c.name}</option>`).join('');
  document.querySelector('#editModal h3').textContent = '添加账单';
  document.getElementById('editModal').classList.remove('hidden');
}
async function saveEdit() {
  const id = document.getElementById('editId').value;
  const body = { item_name: document.getElementById('editName').value, amount: parseFloat(document.getElementById('editAmount').value), category: document.getElementById('editCategory').value, trans_date: document.getElementById('editDate').value.replace('T',' ') };
  if (id) {
    await api('/api/transactions/'+id, { method:'PUT', body:JSON.stringify(body) });
  } else {
    const r = await api('/api/transactions/direct', { method:'POST', body:JSON.stringify(body) });
    const result = await r.json();
    if (!result.success) { alert('添加失败: ' + result.error); return; }
  }
  closeEdit();
  loadCurrentTab();
}
async function delTx(id) { if (!confirm('删除?')) return; await api('/api/transactions/'+id, {method:'DELETE'}); loadCurrentTab(); }

// ==================== 分类管理 ====================
async function openCatManager() {
  document.getElementById('catModal').classList.remove('hidden');
  await renderCatList();
}
async function renderCatList() {
  const r = await api('/api/categories');
  const cats = (await r.json()).data;
  document.getElementById('catList').innerHTML = cats.map(c=>`
    <div class="flex items-center gap-2 text-sm py-1 border-b border-[var(--border)]">
      <span>${c.icon}</span> <span class="flex-1">${c.name}</span>
      <input type="color" value="${c.color}" class="w-6 h-6 rounded cursor-pointer" onchange="updateCat(${c.id},null,null,this.value)">
      <button class="btn btn-danger text-xs py-0 px-1" onclick="delCat(${c.id})">×</button>
    </div>`).join('');
}
async function addCategory() {
  const name = document.getElementById('newCatName').value.trim();
  if (!name) return;
  const icon = document.getElementById('newCatIcon').value;
  const color = document.getElementById('newCatColor').value;
  await api('/api/categories', { method:'POST', body:JSON.stringify({ name, icon, color }) });
  document.getElementById('newCatName').value = '';
  renderCatList();
}
async function updateCat(id, name, icon, color) { await api('/api/categories/'+id, {method:'PUT', body:JSON.stringify({name,icon,color})}); }
async function delCat(id) { await api('/api/categories/'+id, {method:'DELETE'}); renderCatList(); }

// ==================== 工具函数 ====================
function getYearMonth() {
  const y = document.getElementById('selYear').value;
  const m = document.getElementById('selMonth').value;
  if (m === 'all') return { month: null, start: '', end: '' };
  const start = `${y}-${m.padStart(2,'0')}-01`;
  const lastDay = new Date(+y, +m, 0).getDate();
  const end = `${y}-${m.padStart(2,'0')}-${String(lastDay).padStart(2,'0')} 23:59:59`;
  return { month: `${y}-${m.padStart(2,'0')}`, start, end };
}
async function updateFeedTotal(ym, catFilter) {
  const monthParam = ym.month || new Date().toISOString().slice(0,7);
  const r = await api('/api/stats/category?month=' + monthParam);
  const d = (await r.json()).data;
  const total = catFilter
    ? (d.find(x => x.category === catFilter)?.total || 0)
    : d.reduce((s,x) => s + x.total, 0);
  document.getElementById('feedTotal').textContent = '¥ ' + total.toFixed(0);
}
function toggleSort(field) {
  if (field === 'date') {
    STORE.currentSort = STORE.currentSort === 'date_desc' ? 'date_asc' : 'date_desc';
  } else {
    STORE.currentSort = STORE.currentSort === 'amount_desc' ? 'amount_asc' : 'amount_desc';
  }
  loadFeed();
}
function pageNav(d) {
  return `<div class="flex justify-between items-center mt-3 text-sm"><span class="text-[var(--text2)]">共 ${d.total} 条 · 第 ${d.page||1} 页</span>
    <div class="flex gap-1"><button class="btn btn-ghost text-xs" ${(d.page||1)<=1?'disabled':''} onclick="STORE.currentPage--;loadCurrentTab()">‹</button>
    <button class="btn btn-ghost text-xs" ${(d.page||1)*20>=d.total?'disabled':''} onclick="STORE.currentPage++;loadCurrentTab()">›</button></div></div>`;
}
async function populateCatFilter(elId, selected) {
  const el = document.getElementById(elId); if (!el) return;
  const r = await api('/api/categories'); const cats = (await r.json()).data;
  el.innerHTML = '<option value="">全部</option>' + cats.map(c=>`<option value="${c.name}" ${c.name===selected?'selected':''}>${c.icon} ${c.name}</option>`).join('');
}
function escHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escAttr(s) { return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
async function exportCSV() { const r=await api('/api/stats/export/csv'); const b=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='bills.csv'; a.click(); }

// ==================== 初始化 ====================
async function init() {
  // 年份下拉
  const selY = document.getElementById('selYear');
  const thisY = new Date().getFullYear();
  selY.innerHTML = Array.from({length:5},(_,i)=>thisY-2+i).map(y=>`<option value="${y}" ${y===thisY?'selected':''}>${y}年</option>`).join('');
  // 月份下拉
  const selM = document.getElementById('selMonth');
  for (let m=1; m<=12; m++) { const o=document.createElement('option'); o.value=String(m); o.textContent=m+'月'; if (m===new Date().getMonth()+1) o.selected=true; selM.appendChild(o); }
  applyI18n();
  document.querySelectorAll('.tab-item').forEach(el => el.addEventListener('click', ()=>switchTab(el.dataset.tab)));
  loadFeed();
}

if (!checkAuth()) { /* show login */ } else { init(); }

// 主题跟随系统
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', ()=>{ if (STORE.theme==='system') applyTheme(); });
applyTheme();
